<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sergio Christoph · Admin</title>
<!-- The full design system (tokens + components) — the same one the storefront uses. -->
<link rel="stylesheet" href="_ds/sergio-christoph-design-system-53d2bbef-909e-47e2-8ee9-5bfc6360e266/styles.css">
<style>
  /* ─────────────────────────────────────────────────────────────
     Admin shell — built on the design-system tokens (brand-matched)
     Layout: sidebar (desktop) / topbar tabs (mobile) + one view at a time
     ───────────────────────────────────────────────────────────── */
  body{background:var(--surface-page)}

  .shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
  @media (max-width:820px){.shell{grid-template-columns:1fr}}

  /* ── sidebar ── */
  .side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
    background:var(--ivory-50);border-right:1px solid var(--border-hairline);padding:26px 0}
  @media (max-width:820px){.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border-hairline);padding:0}}
  .side__brand{display:flex;align-items:center;gap:10px;padding:0 24px 22px;text-decoration:none;color:inherit}
  .side__brand img{height:26px;width:auto}
  .side__brand span{font-size:var(--fs-micro);font-weight:var(--fw-medium);letter-spacing:var(--ls-caps);
    text-transform:uppercase;color:var(--gold-600);border-left:1px solid var(--border-mid);padding-left:10px}
  @media (max-width:820px){.side__brand{padding:18px 20px 10px}}
  .side nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
  @media (max-width:820px){.side nav{flex-direction:row;overflow-x:auto;padding:0 12px 12px;gap:6px}}
  .side__link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px;
    font-size:var(--fs-body-sm);letter-spacing:.01em;color:var(--text-muted);text-decoration:none;
    border-left:2px solid transparent;transition:color var(--dur-fast) var(--ease-luxe),border-color var(--dur-fast) var(--ease-luxe)}
  .side__link:hover{color:var(--text-heading)}
  .side__link.is-on{color:var(--text-heading);border-left-color:var(--gold-500);background:var(--ivory-100)}
  @media (max-width:820px){
    .side__link{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:10px 12px}
    .side__link.is-on{border-bottom-color:var(--gold-500);background:none}
  }
  .side__count{font-size:var(--fs-micro);letter-spacing:.06em;color:var(--text-faint)}
  .side__foot{margin-top:auto;padding:18px 24px 0;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border-hairline)}
  @media (max-width:820px){.side__foot{display:none}}
  .side__foot .sc-btn{width:100%}
  .side__site{font-size:var(--fs-label);letter-spacing:var(--ls-caps-tight);text-transform:uppercase;
    color:var(--text-muted);text-decoration:none;transition:color var(--dur-fast) var(--ease-luxe)}
  .side__site:hover{color:var(--gold-600)}

  /* ── main / views ── */
  .main{padding:var(--space-2xl) var(--container-pad) var(--space-4xl);max-width:1080px;width:100%;margin-inline:auto}
  .view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:var(--space-xl)}
  .view-head h1{font-size:var(--fs-heading);margin:0}
  .view-head .sc-eyebrow{display:block;margin-bottom:8px}

  /* stat cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-hairline);
    border:1px solid var(--border-hairline);margin-bottom:var(--space-2xl)}
  @media (max-width:820px){.stats{grid-template-columns:1fr 1fr}}
  .stat{background:var(--surface-card);padding:22px 22px 18px}
  .stat__num{font-family:var(--font-display);font-size:var(--fs-subheading);color:var(--text-heading);line-height:1}
  .stat__lbl{display:block;margin-top:8px;font-size:var(--fs-micro);font-weight:var(--fw-medium);
    letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}

  /* toolbar (search / filter / sort) */
  .toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:var(--space-lg)}
  .toolbar .sc-field{min-width:0}
  .toolbar__search{flex:1 1 220px}
  .toolbar__select{flex:0 1 190px}

  /* rows */
  .rows{border-top:1px solid var(--border-hairline)}
  .row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;
    padding:16px 0;border-bottom:1px solid var(--border-hairline)}
  .row--cat{grid-template-columns:minmax(0,1fr) auto auto;gap:16px}
  .thumb{width:56px;height:70px;background:linear-gradient(165deg,var(--ivory-0) 30%,var(--ivory-100));
    background-size:cover;background-position:center;position:relative;overflow:hidden}
  .thumb--empty::after{content:"";position:absolute;inset:0;display:grid;place-items:center;
    background:url('_ds/sergio-christoph-design-system-53d2bbef-909e-47e2-8ee9-5bfc6360e266/assets/mark-sparkle-gold.png') center/16px no-repeat;opacity:.4}
  .row__name{font-family:var(--font-display);font-size:var(--fs-body);color:var(--text-heading);line-height:1.3}
  .row__sub{font-size:var(--fs-body-sm);color:var(--text-muted);margin-top:2px}
  .row__meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
  .row__price{font-size:var(--fs-body-sm);letter-spacing:.05em;color:var(--text-heading)}
  .row__acts{display:flex;gap:14px;align-items:center}
  .linkbtn{background:none;border:0;padding:0;cursor:pointer;font-size:var(--fs-micro);font-weight:var(--fw-medium);
    letter-spacing:var(--ls-caps-tight);text-transform:uppercase;color:var(--text-muted);
    transition:color var(--dur-fast) var(--ease-luxe)}
  .linkbtn:hover{color:var(--gold-600)}
  .linkbtn--danger:hover{color:var(--error)}
  .empty{padding:40px 0;font-size:var(--fs-body-sm);color:var(--text-faint)}
  .empty a,.empty button{color:var(--gold-600)}

  /* forms (add / edit pages) */
  .form-page{max-width:680px}
  .form-grid{display:grid;gap:var(--space-md);margin:var(--space-xl) 0}
  .form-grid__row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md)}
  @media (max-width:560px){.form-grid__row{grid-template-columns:1fr}}
  .form-foot{display:flex;gap:12px;align-items:center;padding-top:var(--space-md);border-top:1px solid var(--border-hairline)}

  /* ── image slots (main + 4 complementary, per Viewing Room ratios) ── */
  .img-slots{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:4px}
  @media (max-width:640px){.img-slots{grid-template-columns:repeat(3,1fr)}}
  .img-slot{display:flex;flex-direction:column;gap:6px;min-width:0}
  .img-slot__frame{position:relative;width:100%;overflow:hidden;border:1px solid var(--border-hairline);
    background:linear-gradient(165deg,var(--ivory-0) 30%,var(--ivory-100))}
  .img-slot__frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .img-slot--empty{cursor:pointer}
  .img-slot--empty::after{content:"";position:absolute;inset:0;display:grid;place-items:center;
    background:url('_ds/sergio-christoph-design-system-53d2bbef-909e-47e2-8ee9-5bfc6360e266/assets/mark-sparkle-gold.png') center/14px no-repeat;opacity:.35}
  .img-slot__hint{position:absolute;left:0;right:0;bottom:0;padding:4px 2px;text-align:center;
    font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);background:rgba(255,255,255,.75)}
  .img-slot__req{position:absolute;top:4px;left:4px;padding:2px 6px;font-size:9px;letter-spacing:.08em;
    text-transform:uppercase;background:var(--gold-500);color:var(--ivory-0)}
  .img-slot__acts{display:flex;gap:10px;justify-content:center}
  .img-slot__lbl{display:block;text-align:center;font-size:var(--fs-micro);font-weight:var(--fw-medium);
    letter-spacing:var(--ls-caps-tight);text-transform:uppercase;color:var(--text-muted)}

  /* modal (design-system dialog + small admin overrides) */
  .sc-dialog.admin-dialog{max-width:460px;padding:40px;max-height:86vh;overflow:auto}
  .admin-dialog h2{font-size:var(--fs-subheading);margin:0 0 6px}
  .admin-dialog p{font-size:var(--fs-body-sm);color:var(--text-muted);margin:0 0 20px}

  /* ── cropper ── */
  .sc-dialog.crop-dialog{max-width:560px}
  .crop-vp{position:relative;width:100%;overflow:hidden;background:var(--ivory-100);
    touch-action:none;cursor:grab;user-select:none}
  .crop-vp:active{cursor:grabbing}
  .crop-vp img{position:absolute;left:0;top:0;max-width:none;pointer-events:none;transform-origin:0 0}
  .crop-zoom{width:100%;margin-top:16px;accent-color:var(--gold-600)}
  .crop-note{font-size:var(--fs-body-sm);color:var(--text-muted);margin:10px 0 0}

  /* ── live product preview (Add / Edit piece) — mirrors the Viewing Room gallery ── */
  .form-wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:clamp(32px,4vw,64px);align-items:start}
  @media (max-width:980px){.form-wrap{grid-template-columns:1fr}}
  .form-preview{position:sticky;top:32px}
  @media (max-width:980px){.form-preview{position:static}}
  .img-slot__lbl{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pv-frame{position:relative;width:100%;overflow:hidden;border:1px solid var(--border-hairline);
    background:radial-gradient(120% 130% at 50% 20%,#FFFFFF 40%,var(--ivory-100) 100%)}
  .pv-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .pv-sparkle{position:absolute;inset:0;
    background:url('_ds/sergio-christoph-design-system-53d2bbef-909e-47e2-8ee9-5bfc6360e266/assets/mark-sparkle-gold.png') center/22px no-repeat;opacity:.3}
  .pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.6vw,20px);margin-top:clamp(12px,1.6vw,20px)}
  .pv-stagger{margin-top:clamp(18px,3vw,40px)}
  .pv-info{margin-bottom:18px}
  .pv-name{font-family:var(--font-display);font-size:var(--fs-lede);line-height:1.3;color:var(--text-heading)}
  .pv-sub{font-size:var(--fs-body-sm);color:var(--text-muted);margin-top:4px}
  .pv-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .pv-price{font-size:var(--fs-body-sm);letter-spacing:.05em;color:var(--text-heading);margin-top:10px}

  /* toast (with undo) */
  .sc-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink-900);color:var(--ivory-50);font-size:var(--fs-body-sm);letter-spacing:.02em;
    padding:12px 22px;z-index:120;display:flex;gap:18px;align-items:center;
    transition:opacity var(--dur-base) var(--ease-luxe),transform var(--dur-base) var(--ease-luxe);pointer-events:none}
  .sc-toast.is-on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .sc-toast__undo{background:none;border:0;color:var(--gold-300);cursor:pointer;font:inherit;
    letter-spacing:var(--ls-caps-tight);text-transform:uppercase;font-size:var(--fs-micro);padding:0}
  .sc-toast__undo:hover{color:var(--gold-200)}
</style>
</head>
<body>
<div class="shell">

  <!-- ══════════ Sidebar (top tabs on mobile) ══════════ -->
  <aside class="side">
    <a class="side__brand" href="#/dashboard">
      <img src="_ds/sergio-christoph-design-system-53d2bbef-909e-47e2-8ee9-5bfc6360e266/assets/logo-black.png" alt="SERGIO CHRISTOPH">
      <span>Admin</span>
    </a>
    <nav aria-label="Admin">
      <a class="side__link" href="#/dashboard" data-nav="dashboard">Dashboard</a>
      <a class="side__link" href="#/categories" data-nav="categories">Categories <span class="side__count" id="count-cat"></span></a>
      <a class="side__link" href="#/items" data-nav="items">Pieces <span class="side__count" id="count-item"></span></a>
    </nav>
    <div class="side__foot">
      <button class="sc-btn sc-btn--ghost sc-btn--sm" id="btn-reset" type="button">Reset demo data</button>
      <a class="side__site" href="Homepage.dc.html">View site ↗</a>
    </div>
  </aside>

  <!-- ══════════ One view at a time, rendered by the router ══════════ -->
  <main class="main" id="view" aria-live="polite"></main>
</div>

<div id="modal-root"></div>
<div class="sc-toast" id="toast" role="status"></div>

<script>
/* ══════════════════════════ Store (localStorage only — no backend, no real data) ══════════════════════════ */
const STORE = "sc_admin_catalog_v1";
const uid = () => Math.random().toString(36).slice(2, 9);
const seed = () => ({
  categories: ["Rings", "Earrings", "Necklaces", "Bracelets & Bangles"],
  items: [
    { id: uid(), name: "The Ubud Solitaire", category: "Rings", price: 24500000, metal: "Platinum", carat: "1.2ct round brilliant", caption: "Solitaire engagement ring", badge: "Bestseller", createdAt: Date.now() - 864e5 * 3, images: [null, null, null, null, null] },
    { id: uid(), name: "Canggu Tennis Bracelet", category: "Bracelets & Bangles", price: 18500000, metal: "White gold", carat: "3.6ct total", caption: "Line bracelet, pavé-set", badge: "", createdAt: Date.now() - 864e5 * 2, images: [null, null, null, null, null] },
    { id: uid(), name: "Amed Rivière Necklace", category: "Necklaces", price: 32500000, metal: "Yellow gold", carat: "2.4ct", caption: "Graduated rivière", badge: "New", createdAt: Date.now() - 864e5, images: [null, null, null, null, null] },
  ],
});
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
  if (!s || !Array.isArray(s.categories) || !Array.isArray(s.items)) { s = seed(); }
  s.items.forEach((it, i) => {
    if (!it.createdAt) it.createdAt = Date.now() - 864e5 * (s.items.length - i);
    // migrate the old single `image` field into the 5-slot images array
    if (!Array.isArray(it.images)) it.images = [it.image || null, null, null, null, null];
    while (it.images.length < 5) it.images.push(null);
    delete it.image;
  });
  return s;
}
const state = load();
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); }
  catch (e) { toast("Browser storage is full — try smaller or fewer photos"); }
}
save();

/* ══════════════════════════ Image slots — mirror of the Viewing Room gallery ══════════════════════════
   Slot 0 is the MAIN image (required). Slots 1–4 are the complementary gallery images.
   Each slot is cropped to the exact ratio the product page uses, so uploads always fit. */
const SLOTS = [
  { label: "Main image",      note: "5:4", ratio: 5 / 4, tw: 900, th: 720 },
  { label: "Complementary 1", note: "4:5", ratio: 4 / 5, tw: 640, th: 800 },
  { label: "Complementary 2", note: "3:4", ratio: 3 / 4, tw: 600, th: 800 },
  { label: "Complementary 3", note: "3:4", ratio: 3 / 4, tw: 600, th: 800 },
  { label: "Complementary 4", note: "4:5", ratio: 4 / 5, tw: 640, th: 800 },
];
let formImages = [null, null, null, null, null];
let cropTargetSlot = 0;

/* ══════════════════════════ Helpers ══════════════════════════ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const idr = (n) => "IDR " + Number(n || 0).toLocaleString("id-ID");
const findItem = (id) => state.items.find((it) => it.id === id);
const catCount = (c) => state.items.filter((it) => it.category === c).length;
const mainSrc = (it) => (it.images && it.images[0]) || "";
const thumb = (it) => {
  const src = mainSrc(it);
  return src ? `<div class="thumb" style="background-image:url('${src}')"></div>` : `<div class="thumb thumb--empty"></div>`;
};
const badgeHTML = (b) => b ? `<span class="sc-badge sc-badge--outline">${esc(b)}</span>` : "";

/* ══════════════════════════ Toast (with optional Undo) ══════════════════════════ */
let toastT, undoFn = null;
function toast(msg, onUndo) {
  const t = $("toast");
  undoFn = onUndo || null;
  t.innerHTML = `<span>${esc(msg)}</span>` + (onUndo ? `<button class="sc-toast__undo" id="toast-undo" type="button">Undo</button>` : "");
  t.classList.add("is-on");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("is-on"), onUndo ? 6000 : 2400);
}
document.addEventListener("click", (e) => {
  if (e.target.id === "toast-undo" && undoFn) { undoFn(); undoFn = null; $("toast").classList.remove("is-on"); }
});

/* ══════════════════════════ Router ══════════════════════════ */
function route() {
  const hash = location.hash || "#/dashboard";
  const parts = hash.replace(/^#\//, "").split("/");

  const nav = parts[0] || "dashboard";
  document.querySelectorAll(".side__link").forEach((a) => a.classList.toggle("is-on", a.dataset.nav === nav));

  $("count-cat").textContent = state.categories.length;
  $("count-item").textContent = state.items.length;

  const view = $("view");
  if (parts[0] === "categories") view.innerHTML = viewCategories();
  else if (parts[0] === "items" && parts[1] === "new") view.innerHTML = viewItemForm(null, false);
  else if (parts[0] === "items" && parts[1] === "edit") view.innerHTML = viewItemForm(findItem(parts[2] || ""), true);
  else if (parts[0] === "items") view.innerHTML = viewItems();
  else view.innerHTML = viewDashboard();

  bindView();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ══════════════════════════ View: Dashboard ══════════════════════════ */
function viewDashboard() {
  const total = state.items.reduce((s, it) => s + Number(it.price || 0), 0);
  const avg = state.items.length ? Math.round(total / state.items.length) : 0;
  const recent = [...state.items].sort((a, b) => b.createdAt - a.createdAt).slice(0, 5);
  return `
  <div class="view-head">
    <div><span class="sc-eyebrow">Overview</span><h1>Dashboard</h1></div>
    <div style="display:flex;gap:10px">
      <a class="sc-btn sc-btn--outline sc-btn--sm" href="#/categories">Manage categories</a>
      <a class="sc-btn sc-btn--primary sc-btn--sm" href="#/items/new">Add piece</a>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat__num">${state.categories.length}</div><span class="stat__lbl">Categories</span></div>
    <div class="stat"><div class="stat__num">${state.items.length}</div><span class="stat__lbl">Pieces</span></div>
    <div class="stat"><div class="stat__num">${idr(total)}</div><span class="stat__lbl">Catalog value</span></div>
    <div class="stat"><div class="stat__num">${idr(avg)}</div><span class="stat__lbl">Avg piece</span></div>
  </div>
  <div class="view-head" style="margin-top:8px"><h1 style="font-size:var(--fs-subheading)">Recently added</h1></div>
  ${recent.length ? `<div class="rows">${recent.map((it) => `
    <div class="row">
      ${thumb(it)}
      <div>
        <div class="row__name">${esc(it.name)}</div>
        <div class="row__sub">${esc(it.caption || it.carat || "")}</div>
        <div class="row__meta"><span class="sc-badge sc-badge--cream">${esc(it.category || "No category")}</span>${badgeHTML(it.badge)}
          <span class="row__price">${idr(it.price)}</span></div>
      </div>
      <div class="row__acts"><a class="linkbtn" href="#/items/edit/${it.id}">Edit</a></div>
    </div>`).join("")}</div>`
  : `<div class="empty">No pieces yet — <a href="#/items/new">add the first one</a>.</div>`}`;
}

/* ══════════════════════════ View: Categories ══════════════════════════ */
function viewCategories() {
  return `
  <div class="view-head">
    <div><span class="sc-eyebrow">Catalog</span><h1>Categories</h1></div>
    <button class="sc-btn sc-btn--primary sc-btn--sm" data-action="new-cat" type="button">Add category</button>
  </div>
  ${state.categories.length ? `<div class="rows">${state.categories.map((c) => `
    <div class="row row--cat">
      <div>
        <div class="row__name">${esc(c)}</div>
        <div class="row__sub">${catCount(c)} piece${catCount(c) === 1 ? "" : "s"}</div>
      </div>
      <span class="sc-badge sc-badge--cream">${catCount(c)}</span>
      <div class="row__acts">
        <button class="linkbtn" data-action="rename-cat" data-cat="${esc(c)}" type="button">Rename</button>
        <button class="linkbtn linkbtn--danger" data-action="del-cat" data-cat="${esc(c)}" type="button">Delete</button>
      </div>
    </div>`).join("")}</div>`
  : `<div class="empty">No categories yet — <button class="linkbtn" data-action="new-cat" type="button">create one</button>.</div>`}`;
}

/* ══════════════════════════ View: Pieces (list + toolbar) ══════════════════════════ */
const ui = { q: "", cat: "All", sort: "Newest" };
function viewItems() {
  // if the filtered category was deleted, fall back to All instead of showing an empty list
  if (ui.cat !== "All" && !state.categories.includes(ui.cat)) ui.cat = "All";
  let list = state.items.filter((it) =>
    (ui.cat === "All" || it.category === ui.cat) &&
    (!ui.q || it.name.toLowerCase().includes(ui.q.toLowerCase()) || String(it.caption || "").toLowerCase().includes(ui.q.toLowerCase())));
  if (ui.sort === "Name A–Z") list = [...list].sort((a, b) => a.name.localeCompare(b.name));
  else if (ui.sort === "Price ↑") list = [...list].sort((a, b) => a.price - b.price);
  else if (ui.sort === "Price ↓") list = [...list].sort((a, b) => b.price - a.price);
  else list = [...list].sort((a, b) => b.createdAt - a.createdAt);

  const catOpts = ['<option value="All">All categories</option>']
    .concat(state.categories.map((c) => `<option${ui.cat === c ? " selected" : ""}>${esc(c)}</option>`)).join("");

  return `
  <div class="view-head">
    <div><span class="sc-eyebrow">Catalog</span><h1>Pieces</h1></div>
    <a class="sc-btn sc-btn--primary sc-btn--sm" href="#/items/new">Add piece</a>
  </div>
  <div class="toolbar">
    <div class="sc-field toolbar__search">
      <label class="sc-field__label" for="f-q">Search</label>
      <input class="sc-input" id="f-q" placeholder="Search name or caption…" value="${esc(ui.q)}">
    </div>
    <div class="sc-field toolbar__select">
      <label class="sc-field__label" for="f-cat">Category</label>
      <select class="sc-input sc-select" id="f-cat">${catOpts}</select>
    </div>
    <div class="sc-field toolbar__select">
      <label class="sc-field__label" for="f-sort">Sort</label>
      <select class="sc-input sc-select" id="f-sort">
        ${["Newest", "Name A–Z", "Price ↑", "Price ↓"].map((s) => `<option${ui.sort === s ? " selected" : ""}>${s}</option>`).join("")}
      </select>
    </div>
  </div>
  ${list.length ? `<div class="rows">${list.map((it) => `
    <div class="row">
      ${thumb(it)}
      <div>
        <div class="row__name">${esc(it.name)}</div>
        <div class="row__sub">${esc(it.caption || it.carat || "")}</div>
        <div class="row__meta">
          <span class="sc-badge sc-badge--cream">${esc(it.category || "No category")}</span>
          ${it.metal ? `<span class="sc-badge sc-badge--cream">${esc(it.metal)}</span>` : ""}${badgeHTML(it.badge)}
          <span class="row__price">${idr(it.price)}</span>
        </div>
      </div>
      <div class="row__acts">
        <a class="linkbtn" href="#/items/edit/${it.id}">Edit</a>
        <button class="linkbtn" data-action="dup-item" data-id="${it.id}" type="button">Duplicate</button>
        <button class="linkbtn linkbtn--danger" data-action="del-item" data-id="${it.id}" type="button">Delete</button>
      </div>
    </div>`).join("")}</div>`
  : `<div class="empty">${ui.q || ui.cat !== "All" ? "No pieces match — try clearing the search or filter." : `No pieces yet — <a href="#/items/new">add the first one</a>.`}</div>`}`;
}

/* ══════════════════════════ Image slots UI ══════════════════════════ */
function slotHTML(i) {
  const S = SLOTS[i], src = formImages[i];
  return `
  <div class="img-slot">
    <div class="img-slot__frame${src ? "" : " img-slot--empty"}" style="aspect-ratio:${S.ratio}" ${src ? "" : `data-img-add="${i}" title="Upload"`}>
      ${src ? `<img src="${src}" alt="${S.label}">` : ""}
      ${i === 0 ? `<span class="img-slot__req">Required</span>` : ""}
      ${src ? "" : `<span class="img-slot__hint">${S.note}</span>`}
    </div>
    <div class="img-slot__acts">
      <button type="button" class="linkbtn" data-img-add="${i}">${src ? "Replace" : "Upload"}</button>
      ${src ? `<button type="button" class="linkbtn linkbtn--danger" data-img-remove="${i}">Remove</button>` : ""}
    </div>
    <span class="img-slot__lbl">${S.label}</span>
  </div>`;
}
function renderSlots() { const el = $("img-slots"); if (el) el.innerHTML = SLOTS.map((_, i) => slotHTML(i)).join(""); renderPreview(); }

/* live preview of the product gallery (same layout the Viewing Room uses) */
function renderPreview() {
  const box = $("piece-preview");
  if (!box) return;
  const val = (id) => { const el = $(id); return el ? el.value : ""; };
  const name = val("it-name").trim() || "Untitled piece";
  const caption = val("it-caption").trim() || val("it-carat").trim();
  const badge = val("it-badge"), metal = val("it-metal"), cat = val("it-cat");
  const frame = (i, extra) => {
    const src = formImages[i];
    return `<div class="pv-frame${extra ? " " + extra : ""}" style="aspect-ratio:${SLOTS[i].ratio}">${src ? `<img src="${src}" alt="">` : `<span class="pv-sparkle"></span>`}</div>`;
  };
  box.innerHTML = `
    <div class="pv-info">
      <div class="pv-name">${esc(name)}</div>
      ${caption ? `<div class="pv-sub">${esc(caption)}</div>` : ""}
      <div class="pv-meta">
        ${cat ? `<span class="sc-badge sc-badge--cream">${esc(cat)}</span>` : ""}
        ${metal ? `<span class="sc-badge sc-badge--cream">${esc(metal)}</span>` : ""}
        ${badge ? `<span class="sc-badge sc-badge--outline">${esc(badge)}</span>` : ""}
      </div>
      <div class="pv-price">${idr(Number(val("it-price") || 0))}</div>
    </div>
    ${frame(0)}
    <div class="pv-grid">${frame(1, "pv-stagger")}${frame(2)}${frame(3, "pv-stagger")}${frame(4)}</div>`;
}

/* ══════════════════════════ View: Add / Edit piece ══════════════════════════ */
function viewItemForm(it, isEdit) {
  if (isEdit && !it) {
    return `<div class="view-head"><div><h1>Edit piece</h1></div></div>
    <div class="empty">That piece no longer exists. <a href="#/items">Back to pieces</a>.</div>`;
  }
  if (!isEdit && !state.categories.length) {
    return `<div class="view-head"><div><span class="sc-eyebrow">Catalog</span><h1>Add piece</h1></div></div>
    <div class="empty">You need a category first — <a href="#/categories">create one</a>.</div>`;
  }
  formImages = it && Array.isArray(it.images) ? it.images.slice(0, 5) : [];
  while (formImages.length < 5) formImages.push(null);

  const v = (k) => esc(it ? it[k] : "");
  return `
  <div class="view-head">
    <div><span class="sc-eyebrow">Catalog</span><h1>${isEdit ? "Edit piece" : "Add piece"}</h1></div>
    ${isEdit ? `<button class="linkbtn linkbtn--danger" data-action="del-item" data-id="${it.id}" type="button">Delete this piece</button>` : ""}
  </div>
  <div class="form-wrap">
  <form class="form-page" id="item-form" autocomplete="off"${it ? ` data-edit-id="${it.id}"` : ""}>
    <div class="form-grid">
      <div class="sc-field">
        <label class="sc-field__label" for="it-name">Item name</label>
        <input class="sc-input" id="it-name" name="name" placeholder="e.g. The Ubud Solitaire" value="${v("name")}" required>
      </div>
      <div class="form-grid__row">
        <div class="sc-field">
          <label class="sc-field__label" for="it-cat">Category</label>
          <select class="sc-input sc-select" id="it-cat" name="category">
            ${state.categories.map((c) => `<option${it && it.category === c ? " selected" : ""}>${esc(c)}</option>`).join("")}
          </select>
        </div>
        <div class="sc-field">
          <label class="sc-field__label" for="it-price">Price (IDR)</label>
          <input class="sc-input" id="it-price" name="price" type="number" min="0" step="100000" placeholder="24500000" value="${v("price")}" required>
        </div>
      </div>
      <div class="form-grid__row">
        <div class="sc-field">
          <label class="sc-field__label" for="it-metal">Metal</label>
          <select class="sc-input sc-select" id="it-metal" name="metal">
            ${["White gold", "Yellow gold", "Rose gold", "Platinum"].map((m) => `<option${it && it.metal === m ? " selected" : ""}>${m}</option>`).join("")}
          </select>
        </div>
        <div class="sc-field">
          <label class="sc-field__label" for="it-badge">Badge</label>
          <select class="sc-input sc-select" id="it-badge" name="badge">
            <option value="">— None —</option>
            ${["New", "Bestseller", "Limited"].map((b) => `<option value="${b}"${it && it.badge === b ? " selected" : ""}>${b}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="form-grid__row">
        <div class="sc-field">
          <label class="sc-field__label" for="it-carat">Stone / carat</label>
          <input class="sc-input" id="it-carat" name="carat" placeholder="1.2ct round brilliant" value="${v("carat")}">
        </div>
        <div class="sc-field">
          <label class="sc-field__label" for="it-caption">Caption</label>
          <input class="sc-input" id="it-caption" name="caption" placeholder="Solitaire engagement ring" value="${v("caption")}">
        </div>
      </div>
      <div class="sc-field">
        <label class="sc-field__label">Photos — main + up to 4 complementary</label>
        <div class="img-slots" id="img-slots">${SLOTS.map((_, i) => slotHTML(i)).join("")}</div>
        <span class="sc-field__hint">Each photo is cropped to the exact ratio its slot uses on the product page. Stored in this browser only.</span>
      </div>
    </div>
    <div class="form-foot">
      <button type="submit" class="sc-btn sc-btn--primary">${isEdit ? "Save changes" : "Add piece"}</button>
      <a class="sc-btn sc-btn--ghost" href="#/items">Cancel</a>
    </div>
  </form>
  <aside class="form-preview">
    <span class="sc-eyebrow" style="display:block;margin-bottom:14px">Preview · product gallery</span>
    <div id="piece-preview"></div>
    <span class="sc-field__hint" style="display:block;margin-top:16px">Updates live as you type and upload.</span>
  </aside>
  </div>`;
}

/* ══════════════════════════ Modals (design-system dialog) ══════════════════════════ */
function openModal(html) { $("modal-root").innerHTML = `
  <div class="sc-dialog-scrim" id="modal-scrim">
    <div class="sc-dialog admin-dialog" role="dialog" aria-modal="true">${html}</div>
  </div>`;
  const scrim = $("modal-scrim");
  scrim.addEventListener("click", (e) => { if (e.target === scrim) closeModal(); });
}
const closeModal = () => { $("modal-root").innerHTML = ""; };

function promptCategory(title, initial, onSubmit) {
  openModal(`
    <h2>${esc(title)}</h2>
    <p>Categories group pieces in the shop.</p>
    <form id="modal-form">
      <div class="sc-field">
        <label class="sc-field__label" for="modal-input">Category name</label>
        <input class="sc-input" id="modal-input" value="${esc(initial || "")}" required>
      </div>
      <div style="display:flex;gap:12px;margin-top:22px">
        <button type="submit" class="sc-btn sc-btn--primary sc-btn--sm">Save</button>
        <button type="button" class="sc-btn sc-btn--ghost sc-btn--sm" id="modal-cancel">Cancel</button>
      </div>
    </form>`);
  $("modal-cancel").addEventListener("click", closeModal);
  $("modal-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("modal-input").value.trim();
    if (name) { onSubmit(name); closeModal(); }
  });
}

/* ══════════════════════════ Cropper — drag to position, slider to zoom, canvas export ══════════════════════════ */
function openCropper(slot, src) {
  const S = SLOTS[slot];
  openModal(`
    <h2>Crop · ${S.label}</h2>
    <p>Drag the photo to position it, zoom with the slider. It will be saved at ${slot === 0 ? "the hero" : "a gallery"} ratio of ${S.note}.</p>
    <div class="crop-vp" id="crop-vp" style="aspect-ratio:${S.ratio}"><img id="crop-img" src="${src}" alt=""></div>
    <input type="range" id="crop-zoom" class="crop-zoom" min="0" max="100" value="0" aria-label="Zoom">
    <div style="display:flex;gap:12px;margin-top:18px">
      <button type="button" class="sc-btn sc-btn--primary sc-btn--sm" id="crop-use">Use photo</button>
      <button type="button" class="sc-btn sc-btn--ghost sc-btn--sm" id="crop-cancel">Cancel</button>
    </div>`);

  const vp = $("crop-vp"), img = $("crop-img"), zoom = $("crop-zoom");
  let c = { s: 1, tx: 0, ty: 0 }, cover = 1;

  const apply = () => { img.style.transform = `translate(${c.tx}px,${c.ty}px) scale(${c.s})`; };
  const clamp = () => {
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const w = img.naturalWidth * c.s, h = img.naturalHeight * c.s;
    c.tx = Math.min(0, Math.max(vw - w, c.tx));
    c.ty = Math.min(0, Math.max(vh - h, c.ty));
  };
  const init = () => {
    const vw = vp.clientWidth, vh = vp.clientHeight;
    cover = Math.max(vw / img.naturalWidth, vh / img.naturalHeight);
    c.s = cover;
    c.tx = (vw - img.naturalWidth * c.s) / 2;
    c.ty = (vh - img.naturalHeight * c.s) / 2;
    clamp(); apply();
  };

  zoom.addEventListener("input", () => {
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const cx = (vw / 2 - c.tx) / c.s, cy = (vh / 2 - c.ty) / c.s;   // image point under viewport centre
    c.s = cover * (1 + 2.5 * (zoom.value / 100));                    // cover → 2.5×
    c.tx = vw / 2 - cx * c.s; c.ty = vh / 2 - cy * c.s;
    clamp(); apply();
  });

  let drag = null;
  vp.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, tx: c.tx, ty: c.ty }; vp.setPointerCapture(e.pointerId); });
  vp.addEventListener("pointermove", (e) => { if (!drag) return; c.tx = drag.tx + (e.clientX - drag.x); c.ty = drag.ty + (e.clientY - drag.y); clamp(); apply(); });
  vp.addEventListener("pointerup", () => drag = null);
  vp.addEventListener("pointercancel", () => drag = null);

  if (img.complete && img.naturalWidth) init(); else img.onload = init;

  $("crop-cancel").addEventListener("click", closeModal);
  $("crop-use").addEventListener("click", () => {
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const sx = -c.tx / c.s, sy = -c.ty / c.s, sw = vw / c.s, sh = vh / c.s;
    const cv = document.createElement("canvas");
    cv.width = S.tw; cv.height = S.th;
    cv.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, S.tw, S.th);
    formImages[slot] = cv.toDataURL("image/jpeg", 0.8);
    renderSlots();
    closeModal();
    toast(S.label + " photo set");
  });
}

/* hidden shared file input */
const fileIn = document.createElement("input");
fileIn.type = "file"; fileIn.accept = "image/*"; fileIn.style.display = "none";
document.body.appendChild(fileIn);
fileIn.addEventListener("change", () => {
  const f = fileIn.files && fileIn.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => openCropper(cropTargetSlot, r.result);
  r.readAsDataURL(f);
});

/* ══════════════════════════ Per-view event binding ══════════════════════════ */
function bindView() {
  const q = $("f-q");
  if (q) q.addEventListener("input", (e) => { ui.q = e.target.value; refreshListOnly(); });
  const cat = $("f-cat");
  if (cat) cat.addEventListener("change", (e) => { ui.cat = e.target.value; route(); });
  const sort = $("f-sort");
  if (sort) sort.addEventListener("change", (e) => { ui.sort = e.target.value; route(); });

  const form = $("item-form");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (!formImages[0]) {
        toast("A main photo is required");
        const slots = $("img-slots");
        if (slots) slots.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      const f = new FormData(form);
      const data = {
        name: (f.get("name") || "").trim(),
        category: f.get("category"),
        price: Number(f.get("price") || 0),
        metal: f.get("metal"),
        carat: (f.get("carat") || "").trim(),
        caption: (f.get("caption") || "").trim(),
        badge: f.get("badge") || "",
        images: formImages.slice(),
      };
      const editing = form.dataset.editId;
      if (editing) {
        const it = findItem(editing);
        if (it) Object.assign(it, data);
        toast("Changes saved · " + data.name);
      } else {
        state.items.push({ id: uid(), createdAt: Date.now(), ...data });
        toast("Piece added · " + data.name);
      }
      save();
      location.hash = "#/items";
    });
    /* live preview — refresh on every field change */
    ["it-name", "it-caption", "it-price", "it-carat"].forEach((id) => { const el = $(id); if (el) el.addEventListener("input", renderPreview); });
    ["it-cat", "it-metal", "it-badge"].forEach((id) => { const el = $(id); if (el) el.addEventListener("change", renderPreview); });
    renderPreview();
  }
}

/* Re-render only the list (keeps focus in the search box while typing) */
function refreshListOnly() {
  const scroll = window.scrollY;
  const active = document.activeElement && document.activeElement.id;
  $("view").innerHTML = viewItems();
  bindView();
  if (active) { const el = $(active); if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } }
  window.scrollTo(0, scroll);
}

/* ══════════════════════════ Global actions (event delegation) ══════════════════════════ */
document.addEventListener("click", (e) => {
  /* image slots */
  const add = e.target.closest("[data-img-add]");
  if (add) { cropTargetSlot = Number(add.dataset.imgAdd); fileIn.value = ""; fileIn.click(); return; }
  const rm = e.target.closest("[data-img-remove]");
  if (rm) { formImages[Number(rm.dataset.imgRemove)] = null; renderSlots(); return; }

  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const act = btn.dataset.action;

  if (act === "new-cat") {
    promptCategory("Add category", "", (name) => {
      if (state.categories.some((c) => c.toLowerCase() === name.toLowerCase())) { toast("That category already exists"); return; }
      state.categories.push(name); save(); route();
      toast("Category added · " + name);
    });

  } else if (act === "rename-cat") {
    const old = btn.dataset.cat;
    promptCategory("Rename category", old, (name) => {
      const i = state.categories.indexOf(old);
      if (i === -1) return;
      state.categories[i] = name;
      state.items.forEach((it) => { if (it.category === old) it.category = name; });  // rename propagates
      save(); route();
      toast("Renamed · " + old + " → " + name);
    });

  } else if (act === "del-cat") {
    const c = btn.dataset.cat;
    const idx = state.categories.indexOf(c);
    const affected = state.items.filter((it) => it.category === c);
    if (idx === -1) return;
    state.categories.splice(idx, 1);
    affected.forEach((it) => { it.category = ""; });
    const snapshot = { cat: c, idx, affected: affected.map((it) => it.id) };
    save(); route();
    toast(`Deleted “${c}”${affected.length ? " · " + affected.length + " piece(s) uncategorised" : ""}`, () => {
      state.categories.splice(snapshot.idx, 0, snapshot.cat);
      snapshot.affected.forEach((id) => { const it = findItem(id); if (it) it.category = snapshot.cat; });
      save(); route();
    });

  } else if (act === "dup-item") {
    const it = findItem(btn.dataset.id);
    if (!it) return;
    const copy = { ...it, id: uid(), images: (it.images || []).slice(), name: it.name + " (copy)", createdAt: Date.now() };
    state.items.push(copy); save(); route();
    toast("Duplicated · " + copy.name);

  } else if (act === "del-item") {
    const id = btn.dataset.id;
    const idx = state.items.findIndex((x) => x.id === id);
    if (idx === -1) return;
    const removed = state.items[idx];
    state.items.splice(idx, 1); save();
    if (location.hash.startsWith("#/items/edit")) location.hash = "#/items"; else route();
    toast("Deleted · " + removed.name, () => {
      state.items.splice(idx, 0, removed); save(); route();
    });
  }
});

/* ══════════════════════════ Sidebar footer actions ══════════════════════════ */
$("btn-reset").addEventListener("click", () => {
  openModal(`
    <h2>Reset demo data?</h2>
    <p>This clears every change you made in this browser and restores the sample catalog.</p>
    <div style="display:flex;gap:12px;margin-top:22px">
      <button type="button" class="sc-btn sc-btn--primary sc-btn--sm" id="reset-yes">Reset</button>
      <button type="button" class="sc-btn sc-btn--ghost sc-btn--sm" id="reset-no">Cancel</button>
    </div>`);
  $("reset-no").addEventListener("click", closeModal);
  $("reset-yes").addEventListener("click", () => {
    const fresh = seed();
    state.categories = fresh.categories;
    state.items = fresh.items;
    save(); closeModal(); route();
    toast("Demo data restored");
  });
});

/* go */
route();
</script>
